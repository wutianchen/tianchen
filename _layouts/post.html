<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a class="brand" href="{{ '/' | relative_url }}">YN</a>
      <ul class="nav-links">
        <li><a href="{{ '/#blog' | relative_url }}">← All posts</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <article class="post container">
      <header class="post-header">
        <h1>{{ page.title }}</h1>
        <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      </header>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 {{ site.title }} · <a href="{{ '/' | relative_url }}">Home</a></p>
    </div>
  </footer>
</body>
</html>
